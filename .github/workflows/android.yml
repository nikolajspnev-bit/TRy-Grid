name: Android App bauen

# Baut bei jedem Push auf main eine APK und stellt sie unter "Releases" bereit.
# Fester Link zur neuesten Version:
# https://github.com/nikolajspnev-bit/TRy-Grid/releases/latest/download/TRy-Grid.apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      # Eigener App Schlüssel aus den GitHub Secrets (falls eingetragen).
      - name: Schlüssel vorbereiten
        env:
          KEYSTORE_BASE64: ${{ secrets.TRY_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/try-grid.jks"
            echo "TRY_KEYSTORE_PATH=$RUNNER_TEMP/try-grid.jks" >> "$GITHUB_ENV"
            echo "Eigener Schlüssel wird benutzt."
          else
            echo "Kein Schlüssel eingetragen, Test Schlüssel wird benutzt."
          fi

      - name: APK bauen
        env:
          TRY_KEYSTORE_PASSWORD: ${{ secrets.TRY_KEYSTORE_PASSWORD }}
          TRY_KEY_ALIAS: ${{ secrets.TRY_KEY_ALIAS }}
          TRY_KEY_PASSWORD: ${{ secrets.TRY_KEY_PASSWORD }}
        run: |
          flutter build apk --release --build-number ${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk TRy-Grid.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: TRy Grid Android (Build ${{ github.run_number }})
          body: |
            Zum Installieren TRy-Grid.apk auf dem Android Handy öffnen.
            Beim ersten Mal "Aus dieser Quelle installieren" erlauben.
          files: TRy-Grid.apk
          make_latest: true
